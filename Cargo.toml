[package]
name = "crustlet"
version = "0.1.0"
edition = "2024"

[dependencies]
log = "0.4.28"
uefi = { version = "0.35.0", features = ["alloc", "global_allocator", "logger", "qemu"] }
uefi-raw = { version = "0.11.0" }
uefi_handoff = { git = "https://github.com/tomosnelli/uefi_handoff.git", branch = "master" }

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"

[[bin]]
name = "crustlet"
path = "src/main.rs"

[build-dependencies]
serde = { version = "1.0.221", features = ["derive", "std"] }
toml = "0.9.5"